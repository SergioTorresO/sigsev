services:
  - type: web
    name: sigsev-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    # `corepack enable` falla en la imagen de build de Render (Node 24.x) con
    # "EROFS: read-only file system, unlink '/usr/bin/pnpm'" — esa ruta ya
    # trae un pnpm preinstalado en solo lectura que corepack no puede
    # reemplazar. Se instala pnpm vía npm global en su lugar, que no toca esa ruta.
    buildCommand: npm install -g pnpm@10.32.1 && pnpm install --frozen-lockfile && pnpm --filter sigsev-backend build
    startCommand: pnpm --filter sigsev-backend start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
