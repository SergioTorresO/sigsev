services:
  - type: web
    name: sigsev-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    # La imagen de build de Render (Node 24.x) ya trae pnpm preinstalado en
    # una ruta de solo lectura — tanto `corepack enable` como
    # `npm install -g pnpm` fallan con EROFS al intentar reemplazarlo. No
    # hace falta instalarlo: el corepack pre-activado de la imagen ya respeta
    # el campo "packageManager": "pnpm@10.32.1" del package.json raíz.
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter sigsev-backend build
    startCommand: pnpm --filter sigsev-backend start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
