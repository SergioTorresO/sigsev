name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (typecheck + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter sigsev-backend typecheck

      - run: pnpm --filter sigsev-backend test

      - run: pnpm --filter sigsev-backend build

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # NEXT_PUBLIC_API_URL no está disponible en CI (vive en frontend/.env.local,
      # que no se versiona) — api.ts ya cae a http://localhost:4000 si falta, y el
      # build de Next.js no necesita un backend real corriendo, solo compila.
      - run: pnpm --filter sigsev-frontend build
